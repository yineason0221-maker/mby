<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuScan — 免費線上掃描器</title>
  <meta name="description" content="用手機或電腦掃描文件。自動偵測四個角落、校正透視、去陰影，匯出 PNG 或 PDF。" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mobile.css" media="(max-width: 768px)" />
  <link rel="stylesheet" href="css/desktop.css" media="(min-width: 769px)" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script type="module" src="js/app.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>DocuScan<span class="doc">掃</span></h1>
      <p class="subtitle">自動偵測角落 · 透視校正 · 去陰影 · 影印效果</p>
    </header>

    <section class="upload-section">
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" />
        <div class="upload-prompt">
          <span class="upload-icon">📄</span>
          <span class="upload-text">點擊選取圖片，或拖曳圖片到此處</span>
          <span class="upload-hint">支援 jpg、png、webp，最大 10MB</span>
        </div>
      </div>

      <div class="action-btn-row">
        <label for="fileInput" class="btn btn-outline upload-btn">
          選取圖片
        </label>
        <button class="btn btn-primary" id="cameraBtn" style="display:none;">
          <span id="cameraIcon">📷</span> 拍照掃描
        </button>
      </div>
    </section>

    <!-- Camera overlay -->
    <div class="camera-overlay" id="cameraOverlay" style="display:none;">
      <video id="cameraVideo" autoplay playsinline></video>
      <div class="camera-actions">
        <button class="btn btn-secondary" id="cancelCamera">取消</button>
        <button class="btn btn-success" id="captureBtn">
          <span class="spinner" style="display:none;" id="capturingSpinner"></span>
          拍照
        </button>
      </div>
    </div>

    <section class="editor-section" id="editorSection" style="display:none;">
      <div class="preview-row">
        <div class="preview-card">
          <label class="preview-label">原圖</label>
          <canvas id="originalCanvas"></canvas>
        </div>
        <div class="preview-card">
          <label class="preview-label">掃描結果</label>
          <canvas id="scannedCanvas"></canvas>
        </div>
      </div>

      <div class="controls-row">
        <div class="control-group">
          <label class="control-label">掃描模式</label>
          <div class="mode-selector" id="modeSelector">
            <button class="mode-btn active" data-mode="color">彩色</button>
            <button class="mode-btn" data-mode="gray">灰階</button>
            <button class="mode-btn" data-mode="bw">黑白</button>
          </div>
        </div>
        <button class="btn btn-secondary" id="resetBtn">重新掃描</button>
      </div>

      <div class="actions-row">
        <button class="btn btn-success" id="processBtn">
          <span id="processText">開始掃描</span>
        </button>
      </div>

      <div class="download-row">
        <button class="btn btn-outline" id="downloadPng">下載 PNG</button>
        <button class="btn btn-outline" id="downloadPdf">下載 PDF</button>
      </div>
    </section>
  </div>

  <div class="status-bar" id="statusBar"></div>
</body>
</html>
